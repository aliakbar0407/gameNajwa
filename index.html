<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: kanvas penuh layar berisi dunia kotak-kotak (voxel). Joystick kiri bawah, tombol aksi kanan bawah, HUD tipis di atas, kartu dialog dan soal muncul dari bawah/tengah. */
  --sky: #9ADCF5;
  --ink: #2A2147;
  --muted: #6C5F8D;
  --purple: #7C4DCB;
  --purple-d: #5A33A6;
  --lilac: #D2CADD;
  --cream: #DBD3C3;
  --paper: #DEDAD2;
  --pink: #F063B4;
  --green: #1F8A4C;
  --green-d: #12663A;
  --gold: #F6B92B;
  --gold-d: #C98B0A;
  --wood: #9A6232;
  --wood-d: #6A4020;
  --ok: #2FA84F;
  --bad: #E0503A;
  --line: rgba(42, 33, 71, .16);
  --display: 'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#game { position: relative; width: 100%; height: 100%; min-height: 480px; overflow: hidden; background: var(--sky); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#tag { position: absolute; transform: translate(-50%, -100%); background: var(--purple); color: #fff; border: 2px solid #fff; border-radius: 13px; padding: 4px 11px; font: 800 14px/1.2 var(--display); white-space: nowrap; pointer-events: none; z-index: 3; }
.ft { position: absolute; transform: translate(-50%, -50%); font: 800 26px/1 var(--display); -webkit-text-stroke: 5px #5E3A18; paint-order: stroke fill; pointer-events: none; z-index: 4; animation: ftup 1.1s ease-out forwards; }
@keyframes ftup { to { transform: translate(-50%, -150%); opacity: 0; } }
#miniHud { position: absolute; left: 50%; top: 68px; transform: translateX(-50%); background: rgba(34, 26, 56, .86); color: #fff; padding: 8px 16px; border-radius: 999px; font: 800 17px/1 var(--display); white-space: nowrap; pointer-events: none; z-index: 3; }
#fade { position: absolute; inset: 0; background: #120c24; opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 40; }
#fade.on { opacity: 1; pointer-events: auto; }
body.exam #quiz { background: transparent; place-items: end center; pointer-events: none; padding-bottom: 8px; }
body.exam #quiz .card { pointer-events: auto; max-height: none; overflow: hidden; padding: 8px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
body.exam #quiz .qhead { margin-bottom: 8px; }
body.exam #quiz .opts { grid-template-columns: 1fr 1fr; gap: 6px; }
body.exam #quiz .opt { font-size: 16px; padding: 8px 10px; grid-template-columns: 30px 1fr; }
body.exam #quiz .opt b { width: 30px; height: 30px; }
body.exam #quiz .why { margin-top: 8px; padding: 8px 10px; font-size: 14px; }
.mhead { position: sticky; top: -16px; z-index: 3; display: flex; justify-content: space-between; align-items: center; margin: -16px -16px 10px; padding: 8px 12px; background: var(--cream); border-bottom: 2px solid var(--line); border-radius: 21px 21px 0 0; font: 800 18px/1 var(--display); color: #2A2147; }
.mhead .btn { padding: 6px 14px; font-size: 15px; min-height: 0; }
.clock { font-variant-numeric: tabular-nums; }
#pgm { display: block; padding: 0; background: #BFE6F7; z-index: 14; }
#pgCv { position: absolute; inset: 0; width: 100%; height: 100%; }
.pghud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; font: 800 17px/1 var(--display); pointer-events: none; }
.pghud b, .pghud span { background: #fff; border: 2px solid var(--purple); border-radius: 999px; padding: 6px 14px; color: #2A2147; }
#pgX { position: absolute; top: 8px; right: 12px; padding: 8px 14px; font-size: 15px; }
#pgHelp { position: absolute; top: 54px; left: 12px; right: 12px; text-align: center; font-weight: 800; color: #2A2147; font-size: 15px; text-shadow: 0 1px 0 #fff; }
#pgBtns { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
#pgBtns .btn { min-width: 150px; padding: 16px 22px; font-size: 21px; touch-action: none; user-select: none; }
.pgres { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(26,18,48,.45); padding: 12px; }
.clock.sch { background: #2FA84F; border-color: #fff; color: #fff; }
#closet { background: transparent; place-items: end center; pointer-events: none; padding-bottom: 8px; }
#closet .card { pointer-events: auto; width: min(100%, 540px); padding: 10px 12px; }
#closet .opts { grid-template-columns: 1fr 1fr; gap: 6px; }
#closet .opt { font-size: 15px; padding: 7px 9px; grid-template-columns: 30px 1fr; }
#closet .opt b { width: 30px; height: 30px; border-radius: 50%; }
#closet .opt small { display: block; font-size: 11px; line-height: 1.2; opacity: .75; font-weight: 700; }
#closet .qhead { margin-bottom: 6px; }
#ride { position: absolute; inset: 0; z-index: 45; opacity: 0; transition: opacity .45s ease; overflow: hidden; background: linear-gradient(var(--sk1, #7EC8F2), var(--sk2, #CBEBFA)); }
#ride.on { opacity: 1; }
#ride .rsun { position: absolute; right: 12%; top: 12%; width: 64px; height: 64px; border-radius: 50%; background: #FFE066; box-shadow: 0 0 40px 10px rgba(255, 224, 102, .6); }
#ride .rhill { position: absolute; left: 0; right: 0; background-repeat: repeat-x; animation: hillmove linear infinite; }
#ride .h1 { bottom: 30%; height: 26%; background-image: radial-gradient(ellipse 150px 90px at 150px 100%, #7CC65C 98%, transparent); background-size: 300px 100%; animation-duration: 9s; }
#ride .h2 { bottom: 28%; height: 16%; background-image: radial-gradient(ellipse 90px 60px at 90px 100%, #4FA648 98%, transparent); background-size: 180px 100%; animation-duration: 4s; }
@keyframes hillmove { to { background-position-x: -600px; } }
#ride .rroad { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #5B5F6B; border-top: 8px solid #D9D4C8; }
#ride .rroad i { position: absolute; left: 0; right: 0; top: 46%; height: 7px; background: repeating-linear-gradient(90deg, #fff 0 46px, transparent 46px 100px); animation: roadmove .45s linear infinite; }
@keyframes roadmove { to { background-position-x: -100px; } }
#ride .rbus { position: absolute; left: 50%; bottom: 17%; width: min(46%, 300px); transform: translateX(-50%); animation: busbob .32s ease-in-out infinite alternate; }
@keyframes busbob { to { transform: translateX(-50%) translateY(-4px); } }
#ride .wh { transform-box: fill-box; transform-origin: center; animation: spin .35s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#rideTxt { position: absolute; top: 12%; left: 0; right: 0; text-align: center; color: #fff; font: 800 clamp(18px, 4.4vw, 30px)/1.2 var(--display); text-shadow: 0 3px 0 rgba(0, 0, 0, .35); padding: 0 12px; }
.nogl { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(26, 18, 48, .7); }

/* HUD */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-l { display: flex; gap: 8px; align-items: center; }
.hud-r { display: grid; justify-items: end; gap: 4px; }
.ibtn { width: 46px; height: 46px; border-radius: 14px; background: var(--purple); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--purple-d); border: 2px solid #fff; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--purple-d); }
.classpill { height: 40px; padding: 0 14px; border-radius: 999px; background: var(--paper); border: 2px solid var(--purple); display: flex; align-items: center; font: 800 17px/1 var(--display); color: var(--purple-d); }
.starpill { height: 42px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(34, 26, 56, .84); color: #fff; display: flex; align-items: center; gap: 7px; font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; border: 2px solid rgba(255,255,255,.7); }
.need { font: 800 12px/1 var(--body); background: rgba(222,218,210,.92); border-radius: 999px; padding: 5px 9px; color: var(--purple-d); }
.exit { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); width: auto; padding: 0 16px; font: 800 15px var(--display); }
#toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); max-width: min(92%, 420px); background: rgba(34, 26, 56, .9); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 15px; text-align: center; pointer-events: none; z-index: 5; }

/* Kontrol */
#pad { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; width: 136px; height: 136px; border-radius: 50%; background: rgba(255,255,255,.3); border: 3px solid rgba(255,255,255,.75); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--purple); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.22); pointer-events: none; }
#btnA { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 30px; width: 94px; height: 94px; border-radius: 50%; background: var(--pink); color: #fff; border: 4px solid #fff; box-shadow: 0 6px 0 #B53A87; font: 800 18px/1.05 var(--display); display: grid; place-items: center; text-align: center; padding: 0 6px; }
#btnA:active { transform: translateY(3px); box-shadow: 0 3px 0 #B53A87; }
#btnA.off { background: #9C93B5; box-shadow: 0 6px 0 #6F6788; }
#btnA.pulse { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
#game:not([data-mode="play"]):not([data-mode="mini1"]):not([data-mode="mini2"]) #pad,
#game:not([data-mode="play"]):not([data-mode="mini1"]) #btnA { display: none; }
#game[data-mode="title"] .hud, #game[data-mode="end"] .hud { display: none; }
#game:not([data-mode="mini1"]):not([data-mode="mini2"]) .exit { display: none; }

}

function stepM1(dt) {
  const m = M1; if (m.done) return; m.t += dt;
  const ax = inputVec().x, target = Math.abs(ax) > .15 ? ax * 170 : 0; m.vx += (target - m.vx) * Math.min(1, dt * 14); if (Math.abs(ax) > .15) m.dir = ax < 0 ? 2 : 3;

  m.vy = Math.min(900, m.vy + 1550 * dt);
  m.x += m.vx * dt; if (m.x < 12) m.x = 12;
  const hw = 10, hh = 38;
  for (const p of m.plats) if (m.x + hw > p.x && m.x - hw < p.x + p.w && m.y > p.y + 4 && m.y - hh < p.y + p.h) { if (m.vx > 0) m.x = p.x - hw; else if (m.vx < 0) m.x = p.x + p.w + hw; }
  const oy = m.y; m.y += m.vy * dt; m.on = false;

    else if (m.vy < 0 && oy - hh >= p.y + p.h - 1 && m.y - hh < p.y + p.h) { m.y = p.y + p.h + hh; m.vy = 0; }
  }
